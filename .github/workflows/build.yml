name: build

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    # Минуты закрытого репозитория ограничены, а macOS считается с множителем — зависшая сборка не должна их съесть.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: TextMeet-windows
          - os: macos-latest
            artifact: TextMeet-mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright test

      # Движок итогов (llama.cpp) — в resources/llama собранной программы.
      - run: npm run fetch:llama

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: npx electron-builder --win --publish never

      # В выпуске Node-fuses выключены. Сквозной тест идёт на тестовой копии (scripts/make-test-copy.mjs): у неё эти
      # fuses включены обратно и есть признак тестовой сборки — без них Playwright не управляет программой, а тестовые
      # подмены не действуют. Копия в загружаемые файлы не попадает (там только release/*.exe).
      # Собранная программа пишет и сводит дорожки своим ffmpeg (из app.asar.unpacked) и запускает свой движок итогов.
      - name: Check the packaged app (Windows)
        if: runner.os == 'Windows'
        run: |
          node scripts/check-fuses.mjs release/win-unpacked/TextMeet.exe
          node scripts/make-test-copy.mjs release/win-unpacked release/test-unpacked
          npx playwright test e2e/packaged.spec.ts
        env:
          TEXTMEET_PACKAGED_APP: release/test-unpacked/TextMeet.exe

      - name: Package (macOS, ad-hoc signed .dmg)
        if: runner.os == 'macOS'
        run: |
          npx electron-builder --mac dir --arm64 --publish never
          APP="$(find release -maxdepth 2 -name 'TextMeet.app' -type d | head -n 1)"
          echo "App: $APP"
          node scripts/check-fuses.mjs "$APP"
          # Тестовая копия для сквозного теста (как на Windows); признак тестовой сборки кладётся до подписи.
          TEST_APP=release/test/TextMeet.app
          node scripts/make-test-copy.mjs "$APP" "$TEST_APP"
          # Неподписанное arm64-приложение macOS не запускает — подписываем ad-hoc, как в спайке.
          # ffmpeg (сведение дорожек) лежит в app.asar.unpacked, движок итогов — в Resources/llama: их тоже подписываем.
          for A in "$APP" "$TEST_APP"; do
            find "$A" \( -name '*.node' -o -name '*.dylib' -o -name 'ffmpeg' -o -name 'llama-server' \) -type f -exec codesign --force --sign - {} \;
            codesign --force --deep --sign - "$A"
            codesign --verify --deep --verbose=2 "$A"
          done
          # Собранная программа пишет и сводит дорожки своим подписанным ffmpeg (на тестовой копии; .dmg — из оригинала).
          TEXTMEET_PACKAGED_APP="$TEST_APP/Contents/MacOS/TextMeet" npx playwright test e2e/packaged.spec.ts
          mkdir -p dmg
          ditto "$APP" dmg/TextMeet.app
          ln -s /Applications dmg/Applications
          VERSION="$(node -p "require('./package.json').version")"
          hdiutil create -volname TextMeet -srcfolder dmg -ov -format UDZO "release/TextMeet-$VERSION-arm64.dmg"

      - uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artifact }}
          path: |
            release/*.exe
            release/*.dmg
          if-no-files-found: error
